[project]
name = "medmind_ai_backend"
version = "0.1.0"
description = "Backend for MediMind AI scaffold"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.2",
    "psycopg2-binary==2.9.9",
    "structlog==24.1.0",
    "python-dotenv==1.0.1",
    "python-json-logger==2.0.7"
]
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
